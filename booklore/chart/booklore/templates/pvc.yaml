kind: PersistentVolumeClaim
metadata:
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: booklore
  name: booklore-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
